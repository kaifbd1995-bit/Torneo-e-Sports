spring.application.name=its-lazio-esports-api
server.port=8081

# -- Database MySQL ----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/its_lazio_esports?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Rome&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Admin12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -- JPA / Hibernate ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# -- Jackson -----------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# -- JWT ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:ITS-Lazio-Digital-Esports-Secret-Key-2024-AtLeast32Bytes!}
app.jwt.expiration-ms=86400000
