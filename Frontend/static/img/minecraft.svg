<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#87CEEB"/><stop offset="1" stop-color="#4682B4"/></linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5D8A3C"/><stop offset="1" stop-color="#3D5A27"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect y="300" width="800" height="150" fill="url(#grass)"/>
  <rect y="320" width="800" height="130" fill="#8B6914"/>
  <!-- blocks -->
  <rect x="50" y="270" width="60" height="60" fill="#5D8A3C" stroke="#3D5A27" stroke-width="2"/>
  <rect x="110" y="250" width="60" height="80" fill="#5D8A3C" stroke="#3D5A27" stroke-width="2"/>
  <rect x="620" y="260" width="60" height="70" fill="#5D8A3C" stroke="#3D5A27" stroke-width="2"/>
  <rect x="680" y="280" width="60" height="50" fill="#5D8A3C" stroke="#3D5A27" stroke-width="2"/>
  <!-- Minecraft text -->
  <text x="400" y="200" font-family="monospace" font-size="80" font-weight="bold" text-anchor="middle" fill="white" stroke="#000" stroke-width="4">MINECRAFT</text>
  <text x="400" y="255" font-family="monospace" font-size="24" text-anchor="middle" fill="#FFD700">BUILD BATTLE</text>
</svg>